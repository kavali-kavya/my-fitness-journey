<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#b54f89"><meta name="description" content="Your personal workout and wellness tracker"><link rel="manifest" href="manifest.json"><link rel="icon" type="image/png" href="icon-192.png"><title>My Fitness Journey</title>
<style>
:root{--bg:#fff7fb;--card:#fff;--text:#392638;--muted:#897889;--pink:#c55d91;--plum:#895eaa;--lav:#f2eafb;--rose:#fce8f1;--line:#f2e5ef;--green:#278364;--shadow:0 12px 34px #63334c12}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 95% 0%,#f6e8fa 0,transparent 34%),var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:92px}header{padding:22px 20px 22px;background:linear-gradient(135deg,#c15a90,#926cb6);color:#fff;border-radius:0 0 30px 30px;box-shadow:0 8px 24px #a94d852e}.top{display:flex;justify-content:space-between;align-items:center;max-width:820px;margin:auto}h1{font-size:22px;line-height:1.2;margin:0;font-weight:800;letter-spacing:-.4px}header p{margin:6px 0 0;color:#fff0f7;font-size:13px}main{max-width:820px;margin:auto;padding:13px 15px 24px}nav{position:fixed;bottom:0;left:0;right:0;background:#ffffffed;backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 4px max(8px,env(safe-area-inset-bottom));z-index:10}nav button{border:0;background:transparent;color:var(--muted);font-size:11px;padding:8px 4px;border-radius:14px;flex:1;min-height:52px}nav button.active{color:var(--pink);background:var(--rose);font-weight:750}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:17px;margin:12px 0;box-shadow:var(--shadow);animation:up .28s ease both}@keyframes up{from{opacity:.5;transform:translateY(5px)}to{opacity:1;transform:none}}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.muted{color:var(--muted)}.small{font-size:12px}.pill,.tag{display:inline-flex;align-items:center;background:var(--lav);color:var(--plum);padding:6px 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}h2{font-size:18px;letter-spacing:-.2px;margin:3px 0 12px}h3{font-size:15px;margin:0 0 7px}.big{font-size:30px;letter-spacing:-1px;font-weight:850}.btn{border:0;border-radius:15px;background:linear-gradient(110deg,#c35b91,#9165b0);color:white;padding:14px 16px;font-weight:750;width:100%;margin-top:9px;font-size:14px;min-height:48px;cursor:pointer;transition:transform .15s,filter .15s}.btn:active{transform:scale(.985)}.btn.secondary{background:var(--rose);color:#a34578}.btn.light{background:#f6f1f6;color:var(--text)}.btn.danger{background:#fff0f0;color:#ae303c}.btn.video{width:auto;margin:8px 0 0;padding:9px 12px;min-height:40px;background:#fff0f6;color:#a54377;font-size:12px}.progress{height:9px;background:#f2e8f0;border-radius:99px;overflow:hidden;margin:12px 0 8px}.progress span{display:block;height:100%;background:linear-gradient(90deg,#df82ad,#a787cc);border-radius:99px;transition:width .25s}.exercise{border:1px solid var(--line);border-radius:16px;padding:13px;margin:9px 0;background:linear-gradient(120deg,#fff,#fffafe)}.exercise .name{font-weight:730}.exercise .detail{font-size:12px;color:var(--muted);margin-top:3px}.exercise .row{align-items:flex-start}.status{font-size:12px;border:1px solid var(--line);background:#fff;padding:9px;border-radius:11px;max-width:143px;min-width:120px}input,select{max-width:100%;padding:12px;border:1px solid #e8d9e6;border-radius:12px;background:#fff;font:inherit;color:var(--text);margin:5px 0 12px}label{font-size:13px;font-weight:700;display:block}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{background:linear-gradient(140deg,#fff8fc,#f8f3ff);border:1px solid #f5e8f1;border-radius:17px;padding:13px;min-width:0}.stat strong{display:block;font-size:22px;letter-spacing:-.5px}.day{display:flex;justify-content:space-between;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line);gap:10px}.day:last-child{border:0}.tag.done{background:#e8f7f0;color:#217652}.tag.rest{background:#fff4e5;color:#925a13}.notice{background:#fff8e9;border:1px solid #f9e7bf;padding:13px;border-radius:15px;font-size:12px;color:#805b20}.foot{text-align:center;color:var(--muted);font-size:11px;padding:14px}.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:10px 0}.daypick{border:1px solid var(--line);border-radius:12px;background:#fff;padding:10px 2px;color:var(--muted);font-size:11px;min-height:42px}.daypick.selected{background:var(--rose);border-color:#ecc1d6;color:#9f4275;font-weight:750}.chart{height:190px;width:100%;overflow:visible}.history{max-height:440px;overflow:auto}.hidden{display:none!important}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #d892b7;outline-offset:2px}.hero{background:linear-gradient(130deg,#fff,#fff7fb);}.sublabel{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
@media(min-width:650px){body{padding-bottom:24px}main{padding-top:21px}.card{padding:20px;margin:15px 0}nav{position:static;max-width:820px;margin:0 auto 10px;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:7px}header{padding:26px 24px}h1{font-size:25px}}
@media(max-width:380px){main{padding-left:10px;padding-right:10px}.card{padding:14px}.exercise .row{display:block}.status{max-width:none;width:100%;margin-top:10px}.days{gap:4px}.daypick{font-size:10px}}
</style></head>
<body><header><div class="top"><div><h1>My Fitness Journey</h1><p id="todayLine">A little stronger every day</p></div><div aria-hidden="true" style="font-size:32px">🌷</div></div></header><main id="app"></main><nav id="nav" aria-label="Main navigation"><button class="active" data-tab="home">🏠<br>Home</button><button data-tab="plan">🗓️<br>Weekly plan</button><button data-tab="history">📈<br>Progress</button><button data-tab="settings">⚙️<br>Settings</button></nav>
<script>
/* Existing data contract retained: localStorage key mfj_data_v1 and records/weight/weights/reminder fields. */
const STORE='mfj_data_v1';
const plan={
Monday:{title:'Full Body Workout',type:'Strength',items:[['Dumbbell squats','2 sets × 10 reps'],['Dumbbell floor chest press','2 × 10'],['One-arm dumbbell row','2 × 10 each side'],['Dumbbell shoulder press','2 × 8–10'],['Glute bridges','2 × 12'],['Standing calf raises','2 × 15']]},
Tuesday:{title:'Legs & Glutes',type:'Strength',items:[['Dumbbell squats','2 × 10'],['Dumbbell Romanian deadlift','2 × 10'],['Reverse lunges','2 × 8 each leg'],['Glute bridges','3 × 12'],['Side-lying leg raises','2 × 12 each side'],['Calf raises','2 × 15']]},
Wednesday:{title:'Recovery Day',type:'Recovery',items:[['Gentle walking','10 minutes'],['Cat-cow stretch','5 minutes'],["Child’s pose",'5 minutes'],['Hamstring stretch','5 minutes'],['Shoulder and arm stretches','5 minutes'],['Relaxation and breathing','10 minutes']]},
Thursday:{title:'Upper Body Workout',type:'Strength',items:[['Dumbbell biceps curls','2 × 10'],['Dumbbell shoulder press','2 × 10'],['Dumbbell lateral raises','2 × 10'],['Dumbbell floor chest press','2 × 10'],['One-arm dumbbell row','2 × 10 each side'],['Overhead triceps extension','2 × 10']]},
Friday:{title:'Full Body Workout',type:'Strength',items:[['Dumbbell sumo squats','2 × 10'],['Dumbbell deadlift','2 × 10'],['Dumbbell hammer curls','2 × 10'],['Dumbbell floor press','2 × 10'],['Bird-dog exercise','2 × 10 each side'],['Glute bridges','2 × 12']]},
Saturday:{title:'Active Recovery',type:'Recovery',items:[['Gentle walking','15 minutes'],['Full-body stretching','15 minutes'],['Light mobility exercises','10 minutes'],['Relaxation','10 minutes']]},
Sunday:{title:'Rest Day',type:'Rest',items:[['Optional gentle stretching','5–10 minutes'],['Relaxation','As needed']]}
};
const days=Object.keys(plan);let data=load();let tab='home',selectedDay=dayName();
function emptyData(){return {records:{},weight:37,weights:[],reminder:false}}
function load(){try{const old=JSON.parse(localStorage.getItem(STORE));if(!old||typeof old!=='object')return emptyData();return {...emptyData(),...old,records:old.records&&typeof old.records==='object'?old.records:{},weights:Array.isArray(old.weights)?old.weights:[]}}catch(e){return emptyData()}}
function save(){localStorage.setItem(STORE,JSON.stringify(data))}
function dateKey(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function dayName(d=new Date()){return d.toLocaleDateString('en-US',{weekday:'long'})}
function rec(key=dateKey()){if(!data.records[key]){const day=dayName(new Date(key+'T12:00:00'));data.records[key]={day,title:plan[day].title,statuses:plan[day].items.map(()=> 'Not Started'),sets:{},started:null,ended:null,notes:'',duration:0};save()}const r=data.records[key];if(!Array.isArray(r.statuses))r.statuses=plan[r.day]?.items.map(()=> 'Not Started')||[];return r}
function isRest(day){return plan[day]?.type==='Rest'}function doneCount(r){return r.statuses.filter(s=>s==='Completed').length}function percent(r){return Math.round(doneCount(r)/Math.max(r.statuses.length,1)*100)}
function statusLabel(r){if(isRest(r.day))return 'Rest Day';if(r.statuses.length&&r.statuses.every(s=>s==='Skipped'))return 'Skipped';if(r.ended)return 'Completed';if(r.statuses.length&&r.statuses.every(s=>s==='Completed'||s==='Skipped')&&r.statuses.some(s=>s==='Completed'))return 'Completed';if(r.statuses.some(s=>s==='Completed'||s==='In Progress')||r.started)return 'In Progress';if(r.statuses.some(s=>s==='Skipped'))return 'In Progress';return 'Not Started'}
function dateText(d=new Date()){return d.toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function getWeekDate(d){const n=new Date();n.setDate(n.getDate()-((n.getDay()+6)%7)+days.indexOf(d));return n}
function render(){document.getElementById('todayLine').textContent=dateText();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));const app=document.getElementById('app');app.innerHTML=tab==='home'?home():tab==='plan'?weekly():tab==='history'?historyView():settings();wire()}
function home(){const r=rec(),day=dayName(),p=plan[day],status=statusLabel(r),pc=percent(r);return `<div class="card hero"><div class="row"><div><div class="sublabel">Your ${day}</div><h2 style="margin-top:5px">Good ${new Date().getHours()<12?'morning':new Date().getHours()<18?'afternoon':'evening'} ✨</h2><div class="muted small">${dateText()}</div></div><span class="pill">${p.type}</span></div><h2 style="font-size:20px;margin:16px 0 4px">${p.title}</h2><div class="muted small">🕡 6:30 PM – 7:30 PM · 60 minutes</div><div class="progress"><span style="width:${pc}%"></span></div><div class="row"><span class="muted small">${doneCount(r)} of ${r.statuses.length} exercises completed</span><strong>${pc}%</strong></div><button class="btn" id="startBtn">${r.started&&!r.ended?'Continue workout':status==='Completed'?'View today’s workout':'Start today’s workout'}</button></div><div class="grid"><div class="stat"><span class="muted small">This week</span><strong>${weekCompleted()} <span class="muted small">/ 5</span></strong><span class="muted small">workout days done</span></div><div class="stat"><span class="muted small">Current weight</span><strong>${data.weight||'—'} kg</strong><span class="muted small">latest saved reading</span></div></div><div class="card"><div class="row"><h2>Today’s workout</h2><span class="tag ${status==='Completed'?'done':''}">${status}</span></div>${p.items.map((it,i)=>exerciseCard(it,i,r)).join('')}<div class="muted small" style="margin-top:12px">Completed: ${doneCount(r)} · Remaining: ${r.statuses.filter(s=>s!=='Completed'&&s!=='Skipped').length}</div><button class="btn secondary" id="finishBtn">Mark entire day completed</button></div><div class="notice">Begin with light weights and comfortable effort. Rest between sets, and stop if you feel dizzy or have sharp pain.</div>`}
function exerciseCard(it,i,r){const s=r.statuses[i]||'Not Started';const video='https://www.youtube.com/results?search_query='+encodeURIComponent(it[0]+' exercise demonstration');return `<div class="exercise"><div class="row"><div><div class="name">${esc(it[0])}</div><div class="detail">${esc(it[1])}</div></div><select class="status statusSelect" data-i="${i}" aria-label="Status for ${esc(it[0])}">${['Not Started','In Progress','Completed','Skipped'].map(x=>`<option ${x===s?'selected':''}>${x}</option>`).join('')}</select></div><a class="btn video" href="${video}" target="_blank" rel="noopener noreferrer">▶ Watch exercise video</a></div>`}
function weekly(){const d=plan[selectedDay],target=getWeekDate(selectedDay),key=dateKey(target),r=data.records[key],state=r?statusLabel(r):d.type==='Rest'?'Rest Day':d.type==='Recovery'?'Recovery':'Not Started';return `<div class="card"><div class="row"><div><h2>Your 7-day workout plan</h2><div class="muted small">Your existing weekly routine</div></div><span class="pill">6:30–7:30 PM</span></div><div class="days">${days.map(x=>`<button class="daypick ${selectedDay===x?'selected':''}" data-day="${x}">${x.slice(0,3)}</button>`).join('')}</div><div class="row"><div><h2 style="margin-bottom:2px">${selectedDay}: ${d.title}</h2><div class="muted small">${dateText(target)} · ${d.type}</div></div><span class="tag ${state==='Completed'?'done':d.type==='Rest'||d.type==='Recovery'?'rest':''}">${state}</span></div>${d.items.map((it,i)=>`<div class="exercise"><div class="name">${i+1}. ${esc(it[0])}</div><div class="detail">${esc(it[1])}</div><a class="btn video" href="https://www.youtube.com/results?search_query=${encodeURIComponent(it[0]+' exercise demonstration')}" target="_blank" rel="noopener noreferrer">▶ Watch exercise video</a></div>`).join('')}</div><div class="card"><h2>Daily schedule</h2><div class="day"><span>Warm-up</span><strong>6:30–6:40 PM</strong></div><div class="day"><span>Main workout</span><strong>6:40–7:15 PM</strong></div><div class="day"><span>Cool-down</span><strong>7:15–7:25 PM</strong></div><div class="day"><span>Relaxation</span><strong>7:25–7:30 PM</strong></div></div>`}
function weekCompleted(){let n=0;for(let i=0;i<7;i++){let r=data.records[dateKey(getWeekDate(days[i]))];if(r&&statusLabel(r)==='Completed'&&!isRest(r.day))n++}return n}
function weightChart(){const list=data.weights.slice().sort((a,b)=>a.date.localeCompare(b.date));if(!list.length)return '<p class="muted small">Add a few dated readings to see your weight trend here.</p>';const vals=list.map(x=>Number(x.weight)),min=Math.min(...vals),max=Math.max(...vals),range=max-min||1,w=320,h=150;const points=vals.map((v,i)=>`${12+i*(296/Math.max(vals.length-1,1))},${130-(v-min)/range*100}`).join(' ');return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Weight progress chart"><defs><linearGradient id="fill" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#df82ad" stop-opacity=".32"/><stop offset="1" stop-color="#df82ad" stop-opacity="0"/></linearGradient></defs><polygon points="${points} ${12+(vals.length-1)*(296/Math.max(vals.length-1,1))},142 12,142" fill="url(#fill)"/><polyline points="${points}" fill="none" stroke="#c55d91" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${vals.map((v,i)=>`<circle cx="${12+i*(296/Math.max(vals.length-1,1))}" cy="${130-(v-min)/range*100}" r="4" fill="#fff" stroke="#c55d91" stroke-width="2"/>`).join('')}<text x="12" y="149" font-size="9" fill="#897889">${esc(list[0].date.slice(5))}</text><text x="${Math.max(12,290)}" y="149" text-anchor="end" font-size="9" fill="#897889">${esc(list[list.length-1].date.slice(5))}</text></svg>`}
function historyView(){const entries=Object.keys(data.records).sort().reverse(),weights=data.weights.slice().sort((a,b)=>b.date.localeCompare(a.date)),first=weights[weights.length-1],last=weights[0];return `<div class="card"><h2>Progress & weight</h2><div class="grid"><div class="stat"><span class="muted small">Previous weight</span><strong>${first?esc(first.weight)+' kg':'—'}</strong><span class="muted small">${first?esc(first.date):'No dated entries yet'}</span></div><div class="stat"><span class="muted small">Latest weight</span><strong>${last?esc(last.weight)+' kg':esc(data.weight||'—')+' kg'}</strong><span class="muted small">${last?esc(last.date):'Current reading'}</span></div></div><h3 style="margin-top:18px">Weight trend</h3>${weightChart()}<label for="weightInput">Current weight (kg)</label><input type="number" step="0.1" min="1" id="weightInput" value="${esc(data.weight||37)}"><button class="btn secondary" id="saveWeight">Save current weight</button><label for="weightDate" style="margin-top:12px">Add dated weight entry</label><input type="date" id="weightDate" value="${dateKey()}"><input type="number" step="0.1" min="1" id="weightEntry" placeholder="Weight in kg"><button class="btn light" id="addWeight">Add to weight history</button>${weights.length?`<h3 style="margin-top:18px">Previous entries</h3>${weights.map(w=>`<div class="day"><span>${esc(w.date)}</span><strong>${esc(w.weight)} kg</strong></div>`).join('')}`:''}</div><div class="card"><div class="row"><h2>Workout history</h2><span class="pill">${entries.length} days</span></div><div class="grid"><div class="stat"><span class="muted small">Completed workouts</span><strong>${entries.filter(k=>statusLabel(data.records[k])==='Completed'&&!isRest(data.records[k].day)).length}</strong></div><div class="stat"><span class="muted small">This week</span><strong>${weekCompleted()}/5</strong></div></div><div class="history" style="margin-top:12px">${entries.length?entries.map(k=>{const r=data.records[k],s=statusLabel(r);return `<div class="day"><div><strong>${esc(k)}</strong><div class="muted small">${esc(r.title)} · ${doneCount(r)}/${r.statuses.length} exercises</div></div><span class="tag ${s==='Completed'?'done':''}">${s} · ${percent(r)}%</span></div>`}).join(''):'<p class="muted">Your workout days will appear here after you start tracking.</p>'}</div><button class="btn light" id="exportBtn">Export workout history as CSV</button></div>`}
function settings(){return `<div class="card"><h2>Settings & backup</h2><p class="muted small">Your progress is saved on this device in this browser.</p><label>Workout time</label><input value="6:30 PM – 7:30 PM" readonly><label>Reminder preference</label><div class="row"><span class="muted small">Daily reminder at 6:25 PM</span><input type="checkbox" id="reminder" style="width:22px" ${data.reminder?'checked':''}></div><p class="muted small">This saves your reminder preference. Browser notifications may not work while the app is closed.</p><button class="btn secondary" id="backupBtn">⬇ Export full backup (JSON)</button><label style="margin-top:18px">Restore backup</label><p class="muted small">Choose a previously exported JSON backup. You’ll confirm before existing records are replaced.</p><input type="file" id="restoreFile" accept=".json,application/json"><button class="btn light" id="restoreBtn">Restore selected backup</button><button class="btn danger" id="resetBtn">Reset all workout data</button></div><div class="notice">Keep a backup before clearing browser data or changing devices. Your workout plan and records remain in this browser’s local storage.</div><div class="foot">My Fitness Journey · Offline personal tracker</div>`}
function wire(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{selectedDay=b.dataset.day;render()});let sb=document.getElementById('startBtn');if(sb)sb.onclick=()=>{const r=rec();if(!r.started)r.started=new Date().toISOString();r.ended=null;save();render()};document.querySelectorAll('.statusSelect').forEach(s=>s.onchange=()=>{const r=rec();r.statuses[+s.dataset.i]=s.value;if(s.value==='In Progress'&&!r.started)r.started=new Date().toISOString();if(s.value==='Completed'&&!r.started)r.started=new Date().toISOString();r.ended=null;save();render()});let f=document.getElementById('finishBtn');if(f)f.onclick=()=>{const r=rec();r.statuses=r.statuses.map(()=> 'Completed');if(!r.started)r.started=new Date().toISOString();r.ended=new Date().toISOString();r.duration=Math.max(1,Math.round((new Date(r.ended)-new Date(r.started))/60000));save();render()};let sw=document.getElementById('saveWeight');if(sw)sw.onclick=()=>{const v=parseFloat(document.getElementById('weightInput').value);if(v>0){data.weight=v;save();render()}};let aw=document.getElementById('addWeight');if(aw)aw.onclick=()=>{const v=parseFloat(document.getElementById('weightEntry').value),d=document.getElementById('weightDate').value;if(v>0&&d){data.weights.push({date:d,weight:v});data.weight=v;save();render()}};let ex=document.getElementById('exportBtn');if(ex)ex.onclick=exportCSV;let rem=document.getElementById('reminder');if(rem)rem.onchange=()=>{data.reminder=rem.checked;save()};let bb=document.getElementById('backupBtn');if(bb)bb.onclick=()=>download('my-fitness-backup.json',JSON.stringify(data,null,2),'application/json');let rf=document.getElementById('restoreFile'),rb=document.getElementById('restoreBtn');if(rb)rb.onclick=()=>restoreBackup(rf);let reset=document.getElementById('resetBtn');if(reset)reset.onclick=()=>{if(confirm('Delete all workout and weight history from this device?')){localStorage.removeItem(STORE);data=load();render()}}}
function validBackup(x){if(!x||typeof x!=='object'||Array.isArray(x)||!x.records||typeof x.records!=='object'||Array.isArray(x.records)||!Array.isArray(x.weights))return false;for(const [date,r] of Object.entries(x.records)){if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!r||typeof r!=='object'||!Array.isArray(r.statuses)||!r.statuses.every(s=>['Not Started','In Progress','Completed','Skipped'].includes(s)))return false}return x.weights.every(w=>w&&/^\d{4}-\d{2}-\d{2}$/.test(w.date)&&Number.isFinite(Number(w.weight))&&Number(w.weight)>0)}
function restoreBackup(input){const file=input?.files?.[0];if(!file){alert('Select a backup file first.');return}const reader=new FileReader();reader.onload=()=>{try{const x=JSON.parse(reader.result);if(!validBackup(x)){alert('This backup file is invalid or incomplete. Your saved records were not changed.');return}if(!confirm('Replace the workout and weight records saved on this device with this backup?')){input.value='';return}const merged={...emptyData(),...x,records:x.records,weights:x.weights};if(!Number.isFinite(Number(merged.weight)))merged.weight=37;merged.reminder=!!merged.reminder;data=merged;save();render();alert('Backup restored successfully.')}catch(e){alert('Could not read this backup. Your saved records were not changed.')} };reader.readAsText(file)}
function download(name,content,type){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function exportCSV(){const rows=[['Date','Day','Workout','Status','Completed','Total','Percent','Duration minutes']];Object.keys(data.records).sort().forEach(k=>{const r=data.records[k];rows.push([k,r.day,r.title,statusLabel(r),doneCount(r),r.statuses.length,percent(r),r.duration||0])});download('workout-history.csv',rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv')}
render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
</script></body></html>
